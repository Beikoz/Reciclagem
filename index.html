<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reciclagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tela">
        <!-- Lixeiras do topo -->
        <section class="lixeiras lixeiras-topo" aria-label="Tipos de reciclagem">
            <img src="sprites/papel_azul.png" alt="Papel" class="lixeira lixeira-1">
            <img src="sprites/plastico_vermelho.png" alt="Plástico" class="lixeira lixeira-2">
            <img src="sprites/vidro_verde.png" alt="Vidro" class="lixeira lixeira-3">
        </section>
        <!-- Texto principal -->
        <h1 class="titulo">Ajude a salvar o mundo reciclando!</h1>
        <!-- Botão -->
        <button onclick="window.location.href='dificuldade.html'" class="botao-iniciar" type="button" id="start-button">
            INICIAR
        </button>
        <!-- Lixeiras da parte inferior -->
        <section class="lixeiras lixeiras-baixo" aria-label="Tipos de reciclagem">
            <img src="sprites/papel_azul.png" alt="Papel" class="lixeira lixeira-4">
            <img src="sprites/plastico_vermelho.png" alt="Plástico" class="lixeira lixeira-5">
            <img src="sprites/vidro_verde.png" alt="Vidro" class="lixeira lixeira-6">
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
