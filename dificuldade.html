<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha a dificuldade</title>
    <link rel="stylesheet" href="dificuldade.css">
</head>
<body>
    <main class="tela-dificuldade">
        <!-- VOLTAR -->
        <a
            href="index.html"
            class="botao-voltar"
        >
            voltar
        </a>
        <section class="conteudo-dificuldade">
            <!-- TÍTULO -->
            <h1 class="titulo-dificuldade">
                ESCOLHA A DIFICULDADE
            </h1>
            <!-- OPÇÕES -->
            <div class="opcoes-dificuldade">
                <!-- NORMAL -->
                <a
                    href="#"
                    class="modo modo-normal"
                >
                    <span class="nome-modo">
                        NORMAL
                    </span>
                    <span class="descricao">
                        Em modo normal, não há vidas e o jogador
                        pode cometer erros à vontade. A velocidade
                        do jogo é mais amigável.
                    </span>
                </a>
                <!-- DIFÍCIL -->
                <a
                    href="#"
                    class="modo modo-dificil"
                >
                    <span class="nome-modo">
                        DIFÍCIL
                    </span>
                    <span class="descricao">
                        Em modo difícil, o jogador possui 3 vidas
                        e a velocidade do jogo é maior, tornando o desafio mais intenso.
                    </span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
